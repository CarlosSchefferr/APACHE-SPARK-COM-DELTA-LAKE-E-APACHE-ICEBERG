[tool.poetry]
name = "spark-delta-iceberg"
version = "0.1.0"
description = "Ambiente único com PySpark, Delta Lake, Apache Iceberg, JupyterLab e MkDocs"
authors = ["Carlos Scheffer"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pyspark = "3.5.1"
delta-spark = "3.2.0"
jupyterlab = "^4.2.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
